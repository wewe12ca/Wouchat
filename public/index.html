<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wouchat - ASIR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #111b21; color: #e9edef; height: 100vh; overflow: hidden; }

        /* Estructura Principal estilo WhatsApp Desktop */
        .app-container { display: flex; width: 100vw; height: 100vh; }

        /* 1. Barra de iconos fija a la izquierda */
        .icon-bar {
            width: 60px;
            background-color: #202c33;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-right: 1px solid #222d34;
        }

        .icon-bar .top-icons, .icon-bar .bottom-icons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aebac1;
            cursor: pointer;
            transition: background 0.2s;
        }

        .icon-btn:hover, .icon-btn.active {
            background-color: #374248;
            color: #00a884;
        }

        /* 2. Panel de Usuarios Conectados (Sidebar) */
        .sidebar {
            width: 320px;
            background-color: #111b21;
            border-right: 1px solid #222d34;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 { font-size: 20px; font-weight: 600; color: #e9edef; }

        .search-container {
            padding: 8px 12px;
            background-color: #111b21;
        }

        .search-box {
            background-color: #202c33;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #e9edef;
            width: 100%;
            font-size: 14px;
        }

        /* Filtros "Todos", "Favoritos", etc. */
        .filter-tags {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
        }

        .tag {
            background-color: #202c33;
            color: #8696a0;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .tag.active {
            background-color: #0a332c;
            color: #00a884;
        }

        /* Lista de usuarios conectados */
        .user-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #1f2c34;
        }

        .user-item:hover { background-color: #202c33; }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #6b7c85;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
        }

        .user-info { flex: 1; }
        .user-info .name { font-size: 16px; font-weight: 500; color: #e9edef; }
        .user-info .status { font-size: 13px; color: #00a884; }

        /* 3. Panel de Chat Principal */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b141a;
            position: relative;
        }

        /* Cabecera del Chat activo */
        .chat-header {
            height: 60px;
            background-color: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222d34;
        }

        /* Contenedor de Mensajes con el fondo característico de WhatsApp */
        .messages-container {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-image: radial-gradient(#1f2c34 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Burbujas de Mensaje */
        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.2px;
            line-height: 19px;
            position: relative;
            word-break: break-word;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        /* Mensajes propios (Verde WhatsApp) */
        .my-message {
            align-self: flex-end;
            background-color: #005c4b;
            color: #e9edef;
            border-top-right-radius: 0;
        }

        /* Mensajes de otros usuarios (Gris oscuro) */
        .other-message {
            align-self: flex-start;
            background-color: #202c33;
            color: #e9edef;
            border-top-left-radius: 0;
        }

        .message-author {
            font-size: 12px;
            font-weight: 600;
            color: #53bdeb;
            margin-bottom: 2px;
        }

        /* Notificaciones del sistema (ej: usuario conectado) */
        .notification {
            align-self: center;
            background-color: #182229;
            color: #8696a0;
            font-size: 12.5px;
            padding: 5px 12px;
            border-radius: 8px;
            margin: 6px 0;
            text-align: center;
            box-shadow: 0 1px 0.5px rgba(0,0,0,.13);
        }

        /* Barra de Entrada de Texto inferior */
        .chat-input-bar {
            height: 62px;
            background-color: #202c33;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input-bar input {
            flex: 1;
            height: 42px;
            background-color: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            color: #e9edef;
            font-size: 15px;
            outline: none;
        }

        .chat-input-bar button {
            background: #00a884;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input-bar button:hover { background-color: #008f6f; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- 1. Barra Lateral de Iconos -->
        <div class="icon-bar">
            <div class="top-icons">
                <div class="icon-btn active" title="Chats">💬</div>
                <div class="icon-btn" title="Llamadas">📞</div>
                <div class="icon-btn" title="Novedades">🌀</div>
            </div>
            <div class="bottom-icons">
                <div class="icon-btn" title="Ajustes">⚙️</div>
            </div>
        </div>

        <!-- 2. Panel de Lista de Usuarios / Chats -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Buscar un chat o iniciar uno nuevo">
                </div>
            </div>

            <div class="filter-tags">
                <div class="tag active">Todos</div>
                <div class="tag">Favoritos</div>
                <div class="tag">Grupos</div>
            </div>

            <ul class="user-list" id="users-list">
