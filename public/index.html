<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wouchat - ASIR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }
        
        /* Contenedor principal en dos columnas */
        .container { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; }
        .chat-section { flex: 2; display: flex; flex-direction: column; }
        .sidebar { flex: 1; background: #1e293b; padding: 15px; border-radius: 8px; height: 350px; overflow-y: auto; }
        
        #messages { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 8px; 
            height: 300px; 
            overflow-y: auto; 
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message { padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; line-height: 1.4; }
        .my-message { background: #3b82f6; align-self: flex-end; text-align: right; }
        .other-message { background: #334155; align-self: flex-start; text-align: left; }
        .notification { text-align: center; color: #94a3b8; font-style: italic; font-size: 0.85rem; margin: 4px 0; align-self: center; }

        #form { display: flex; gap: 10px; }
        #input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #475569; background: #334155; color: #fff; }
        button { padding: 10px 20px; background: #10b981; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #059669; }
        
        h3 { margin-top: 0; color: #38bdf8; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        #users-list { list-style: none; padding: 0; margin: 0; }
        #users-list li { padding: 6px 0; border-bottom: 1px solid #334155; font-size: 0.95rem; }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 25px;">Wouchat - ASIR</h1>
    
    <div class="container">
        <!-- Sección de mensajes y formulario -->
        <div class="chat-section">
            <div id="messages"></div>
            <form id="form">
                <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." required />
                <button>Enviar</button>
            </form>
        </div>

        <!-- Panel lateral de usuarios conectados -->
        <div class="sidebar">
            <h3>Conectados</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let username = prompt("¿Cómo te llamas para entrar a Wouchat?") || "Anónimo";
        socket.emit('join', username);

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat_message', { user: username, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat_message', (data) => {
            const item = document.createElement('div');
            item.classList.add('message');

            if (data.user === username) {
                item.classList.add('my-message');
                item.innerHTML = `<strong>Tú:</strong> ${data.text}`;
            } else {
                item.classList.add('other-message');
                item.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('notification', (text) => {
            const item = document.createElement('div');
            item.classList.add('notification');
            item.textContent = text;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        // Recibir y pintar la lista actualizada de usuarios en la interfaz
        socket.on('update_users', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user;
                usersList.appendChild(li);
            });
        });
    </script>
</body>
</html>
